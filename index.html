  } catch (e) {
    console.error('Storage read error:', e);
    return fallback;

}

// 5. TIMER ENGINE & NETWORK LISTENERS
// ----------------------------------------------------------------------------
let examTimerInterval = null;

function startExamTimer() {
  stopExamTimer();
  examTimerInterval = setInterval(() => {
    if (!state.activeExam || state.view !== 'exam') {
      stopExamTimer();
      return;
    }
    const now = Date.now();
    const remainingSec = Math.max(0, Math.floor((state.activeExam.endTime - now) / 1000));

    const timerEl = document.getElementById('cbt-timer-display');
    const timerBox = document.getElementById('cbt-timer-box');
    if (timerEl) {
      timerEl.textContent = formatTime(remainingSec);
      if (remainingSec <= 300 && timerBox) {
        timerBox.classList.remove('bg-navy-800', 'border-navy-700');
        timerBox.classList.add('bg-red-600', 'border-red-400', 'animate-pulse');
      }
    }

    if (remainingSec <= 0) {
      stopExamTimer();
      showToast('Waktu ujian telah habis! Sistem otomatis mengumpulkan jawaban Anda.', 'warning');
      submitActiveExam(true);
    }
  }, 500);
}

function stopExamTimer() {
  if (examTimerInterval) {
    clearInterval(examTimerInterval);
    examTimerInterval = null;
  }
}

function formatTime(totalSeconds) {
  const hrs = Math.floor(totalSeconds / 3600);
  const mins = Math.floor((totalSeconds % 3600) / 60);
  const secs = totalSeconds % 60;
  if (hrs > 0) {
    return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }
  return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

document.addEventListener('keydown', (e) => {
  if (state.view !== 'exam' || !state.activeExam) return;
  if (document.getElementById('modal-root').innerHTML !== '') return;

  const key = e.key.toUpperCase();
  const curIdx = state.activeExam.currentIndex;
  if (['A', 'B', 'C', 'D', 'E'].includes(key)) {
    const optIdx = key.charCodeAt(0) - 65;
    const q = state.activeExam.questions[curIdx];
    if (q && q.options[optIdx] !== undefined) {
      selectExamAnswer(curIdx, optIdx);
    }
  } else if (e.key === 'ArrowRight') {
    if (curIdx < state.activeExam.questions.length - 1) goToQuestion(curIdx + 1);
  } else if (e.key === 'ArrowLeft') {
    if (curIdx > 0) goToQuestion(curIdx - 1);

function handleLogin(e) {
  e.preventDefault();
  const nameInput = document.getElementById('login-name').value.trim();
  const usernameInput = document.getElementById('login-username').value.trim().toLowerCase();
  const passwordInput = document.getElementById('login-password').value.trim();

  if (!usernameInput || !passwordInput) {
    showToast('Harap isi Username dan Password.', 'error');
    return;
  }

  let user = state.users.find(u => u.username.toLowerCase() === usernameInput && u.password === passwordInput);

  // If user doesn't exist yet and provided a full name, allow instant participant registration!
  if (!user && nameInput && usernameInput !== 'admin') {
    const existingUsername = state.users.find(u => u.username.toLowerCase() === usernameInput);
    if (existingUsername) {
      showToast('Password salah untuk username tersebut.', 'error');
      return;
    }
    user = {
      id: 'U-' + Date.now(),
      name: nameInput,
      username: usernameInput,
      password: passwordInput,
      role: 'peserta',
      school: 'Peserta Mandiri ABM',
      nisn: '009' + Math.floor(1000000 + Math.random() * 9000000)
    };
    state.users.push(user);
    saveToStorage(STORAGE_KEYS.USERS, state.users);
    showToast('Akun peserta baru berhasil dibuat & masuk!', 'success');
  } else if (!user) {
    showToast('Username atau Password tidak valid.', 'error');
    return;
  } else if (nameInput && user.role === 'peserta') {
    // Update display name if participant entered custom name
    user.name = nameInput;
    saveToStorage(STORAGE_KEYS.USERS, state.users);
  }

  state.currentUser = user;
  saveToStorage(STORAGE_KEYS.CURRENT_USER, user);

  if (state.activeExam && state.activeExam.userId === user.id) {
    state.view = 'exam';
    showToast('Sesi ujian yang belum selesai berhasil dipulihkan!', 'info');
  } else {
    state.view = user.role === 'admin' ? 'admin' : 'dashboard';
    showToast(`Selamat datang, ${user.name}!`, 'success');
  }
  render();
}

// 8. EXAM PREPARATION, EXECUTION & AUTOSAVE ENGINE
// ----------------------------------------------------------------------------
function prepareExamMode(modeId) {
  const mode = state.modes.find(m => m.id === modeId);
  if (!mode) return;
  state.selectedMode = mode;
  state.customExamConfig = {
    questionCount: mode.questionCount,
    durationMinutes: mode.durationMinutes,
    difficultyFilter: mode.difficultyFilter || 'ALL',
    shuffleQuestions: mode.shuffleQuestions !== false,
    shuffleOptions: Boolean(mode.shuffleOptions)
  };
  state.view = 'confirm_exam';
  render();
}

function updateCustomExamConfig(field, value) {
  if (!state.customExamConfig) return;
  state.customExamConfig[field] = value;
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startActualExam() {
  const mode = state.selectedMode;
  const cfg = state.customExamConfig;
  if (!mode || !cfg) return;

  // Filter questions based on mode category & difficulty
  let pool = state.questions.filter(q => {
    const catMatch = mode.categoryFilter === 'ALL' ? true : q.category === mode.categoryFilter;
    const diffMatch = (cfg.difficultyFilter === 'ALL' || q.category === 'Minat dan Preferensi')
      ? true
      : q.difficulty === cfg.difficultyFilter;
    return catMatch && diffMatch;
  });

  if (pool.length === 0) {
    // Fallback to category without difficulty filter if strict filter yields 0
    pool = state.questions.filter(q => mode.categoryFilter === 'ALL' ? true : q.category === mode.categoryFilter);
  }

  let selectedQuestions = [];
  if (mode.categoryFilter === 'ALL') {
    // Balanced stratified sampling across all 7 categories
    const categories = [
      'Kemampuan Verbal', 'Kemampuan Numerik', 'Kemampuan Figural',
      'Penalaran Logis', 'Penalaran Spasial', 'Kemampuan Analitis', 'Minat dan Preferensi'
    ];
    const targetCount = Math.min(Number(cfg.questionCount), pool.length);
    const byCat = {};
    categories.forEach(c => {
      const items = pool.filter(q => q.category === c);
      byCat[c] = cfg.shuffleQuestions ? shuffleArray(items) : items;
    });

    let round = 0;
    while (selectedQuestions.length < targetCount && round < 50) {
      for (const c of categories) {
        if (selectedQuestions.length >= targetCount) break;
        if (byCat[c] && byCat[c][round]) {
          selectedQuestions.push(byCat[c][round]);
        }
      }
      round++;
    }
    if (cfg.shuffleQuestions) {
      // Keep Minat & Preferensi grouped at the end just like official ABM, while shuffling cognitive items
      const cog = shuffleArray(selectedQuestions.filter(q => q.category !== 'Minat dan Preferensi'));
      const minat = selectedQuestions.filter(q => q.category === 'Minat dan Preferensi');
      selectedQuestions = [...cog, ...minat];
    }
  } else {
    const ordered = cfg.shuffleQuestions ? shuffleArray(pool) : [...pool];
    selectedQuestions = ordered.slice(0, Math.min(Number(cfg.questionCount), ordered.length));
  }

  // Deep clone questions and optionally shuffle options for cognitive questions
  const examItems = selectedQuestions.map(q => {
    const clone = JSON.parse(JSON.stringify(q));
    if (cfg.shuffleOptions && clone.correctIndex >= 0 && clone.options.length === 5) {
      const indexed = clone.options.map((text, idx) => ({ text, isCorrect: idx === clone.correctIndex }));
      const shuffled = shuffleArray(indexed);
      clone.options = shuffled.map(o => o.text);
      clone.correctIndex = shuffled.findIndex(o => o.isCorrect);
    }
    return clone;
  });

  const durationSec = Number(cfg.durationMinutes) * 60;
  const now = Date.now();

  state.activeExam = {
    sessionId: 'SES-' + now,
    userId: state.currentUser.id,
    modeId: mode.id,
    modeTitle: mode.title,
    startTime: now,
    endTime: now + durationSec * 1000,
    totalDurationSeconds: durationSec,
    currentIndex: 0,
    questions: examItems,
    answers: {}, // { [index]: optionIndex }
    flagged: {}  // { [index]: true }
  };

  saveToStorage(STORAGE_KEYS.ACTIVE_EXAM, state.activeExam);
  state.view = 'exam';
  render();
  startExamTimer();
}

      </div>

}

function submitActiveExam(isAutoTimeout = false) {
  if (!state.activeExam) return;
  stopExamTimer();

  const exam = state.activeExam;
  const now = Date.now();
  const timeUsed = Math.min(exam.totalDurationSeconds, Math.max(1, Math.floor((now - exam.startTime) / 1000)));

  let cognitiveTotal = 0;
  let correctCount = 0;
  let incorrectCount = 0;
  let unansweredCount = 0;

  const categoryStats = {};
  const riasecTotals = { Realistic: [], Investigative: [], Artistic: [], Social: [], Enterprising: [], Conventional: [] };

  const detailedItems = exam.questions.map((q, idx) => {
    const userAns = exam.answers[idx] !== undefined ? exam.answers[idx] : null;
    const isFlagged = Boolean(exam.flagged[idx]);

    if (q.category === 'Minat dan Preferensi') {
      // Likert score 1..5 -> 20..100%
      const scoreVal = userAns !== null ? (userAns + 1) * 20 : 60;
      const dim = q.riasec || 'Investigative';
      if (riasecTotals[dim]) riasecTotals[dim].push(scoreVal);
      return {
        ...q,
        userAnswer: userAns,
        isCorrect: null,
        isFlagged
      };
    } else {
      cognitiveTotal++;
      if (!categoryStats[q.category]) {
        categoryStats[q.category] = { correct: 0, total: 0, pct: 0 };
      }
      categoryStats[q.category].total++;

      let isCorrect = false;
      if (userAns === null) {
        unansweredCount++;
      } else if (userAns === q.correctIndex) {
        correctCount++;
        categoryStats[q.category].correct++;
        isCorrect = true;
      } else {
        incorrectCount++;
      }

      return {
        ...q,
        userAnswer: userAns,
        isCorrect,
        isFlagged
      };
    }
  });

  Object.keys(categoryStats).forEach(cat => {
    const st = categoryStats[cat];
    st.pct = st.total > 0 ? Math.round((st.correct / st.total) * 100) : 0;
  });

  // Compute RIASEC averages if any preference items existed
  const riasecScores = {};
  let hasRiasec = false;
  Object.keys(riasecTotals).forEach(dim => {
    const arr = riasecTotals[dim];
    if (arr.length > 0) {
      hasRiasec = true;
      riasecScores[dim] = Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
    }
  });

  const accuracy = cognitiveTotal > 0 ? Math.round((correctCount / cognitiveTotal) * 100) : 100;
  // Standard CBT Scaled Score (200 - 1000 scale)
  const cbtScore = cognitiveTotal > 0 ? Math.round(200 + (correctCount / cognitiveTotal) * 800) : 0;

  const attemptRecord = {
    id: 'ATT-' + now,
    userId: state.currentUser.id,
    userName: state.currentUser.name,
    username: state.currentUser.username,
    modeId: exam.modeId,
    modeTitle: exam.modeTitle,
    date: new Date(now).toISOString(),
    durationSecondsUsed: timeUsed,
    totalQuestions: exam.questions.length,
    cognitiveTotal,
    correctCount,
    incorrectCount,
    unansweredCount,
    accuracy,
    cbtScore,
    categoryScores: categoryStats,
    riasecScores: hasRiasec ? riasecScores : null,
    items: detailedItems
  };

  state.history.unshift(attemptRecord);
  saveToStorage(STORAGE_KEYS.HISTORY, state.history);

  state.activeExam = null;
  localStorage.removeItem(STORAGE_KEYS.ACTIVE_EXAM);

  state.selectedAttempt = attemptRecord;
  state.resultTab = 'summary';
  state.pembahasanFilter = 'ALL';
  state.view = 'result';
  render();
}

}

// REAL DOCUMENT PARSER (.PDF via PDF.js, .DOCX via Mammoth.js, .TXT/.DOC)
// ----------------------------------------------------------------------------
async function handleDocumentUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const fileName = file.name.toLowerCase();
  showToast(`Membaca dokumen "${file.name}"...`, 'info');

  try {
    let rawText = '';

    if (fileName.endsWith('.pdf')) {
      if (!window.pdfjsLib) throw new Error('Library PDF.js belum termuat.');
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        const pageStrings = content.items.map(item => item.str);
        rawText += pageStrings.join(' ') + '\n\n';
      }
    } else if (fileName.endsWith('.docx')) {
      if (!window.mammoth) throw new Error('Library Mammoth.js belum termuat.');
      const arrayBuffer = await file.arrayBuffer();
      const result = await window.mammoth.extractRawText({ arrayBuffer });
      rawText = result.value;
    } else {
      // Fallback for .txt, .doc (plain/XML text)
      rawText = await file.text();
    }

    state.extractedRawText = rawText;
    state.extractedQuestions = parseQuestionsFromRawText(rawText);

    if (state.extractedQuestions.length > 0) {
      showToast(`Berhasil mengekstrak ${state.extractedQuestions.length} butir soal dari dokumen!`, 'success');
    } else {
      showToast('Dokumen terbaca, namun format nomor soal belum terdeteksi otomatis. Anda dapat menyunting teks di bawah.', 'warning');
    }
    render();
  } catch (err) {
    console.error('Document parse error:', err);
    showToast('Gagal memproses file: ' + err.message, 'error');
  }
}

function parseQuestionsFromRawText(text) {
  // Normalize whitespace & line breaks around numbers and option letters
  const normalized = text
    .replace(/\r\n/g, '\n')
    .replace(/(\s|^)(\d{1,2}[\.\)])\s+/g, '\n$2 ')
    .replace(/(\s|^)([A-E][\.\)])\s+/g, '\n$2 ')
    .replace(/(Jawaban|Kunci|Pembahasan)\s*:/gi, '\n$1:');

  const blocks = normalized.split(/\n(?=\d{1,2}[\.\)]\s)/).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  blocks.forEach((block, idx) => {
    // Match question number header
    const headerMatch = block.match(/^\d{1,2}[\.\)]\s*([\s\S]*)/);
    if (!headerMatch) return;
    const body = headerMatch[1];

    // Extract options A-E
    const optRegex = /\n([A-E])[\.\)]\s*([^\n]+)/g;
    const optionsMap = {};
    let firstOptIndex = body.length;
    let match;

    while ((match = optRegex.exec(body)) !== null) {
      if (match.index < firstOptIndex) firstOptIndex = match.index;
      optionsMap[match[1].toUpperCase()] = match[2].trim();
    }

    const questionText = body.slice(0, firstOptIndex).trim();
    if (!questionText || Object.keys(optionsMap).length < 2) return;

    const options = ['A', 'B', 'C', 'D', 'E'].map(letter => optionsMap[letter] || `Pilihan ${letter}`);

    // Extract Kunci/Jawaban if present
    const ansMatch = body.match(/(?:Jawaban|Kunci)\s*:\s*([A-E])/i);
    const correctIndex = ansMatch ? (ansMatch[1].toUpperCase().charCodeAt(0) - 65) : 0;

    // Extract Pembahasan if present
    const expMatch = body.match(/Pembahasan\s*:\s*([\s\S]*)$/i);
    const explanation = expMatch ? expMatch[1].trim() : 'Pembahasan hasil ekstraksi dokumen. Silakan lengkapi penjelasan langkah demi langkah.';

    // Auto-detect category keywords
    let detectedCategory = 'Kemampuan Verbal';
    const lowerQ = questionText.toLowerCase();
    if (/deret|angka|persen|harga|rata-rata|bilangan|perbandingan|rp\d/.test(lowerQ)) detectedCategory = 'Kemampuan Numerik';
    else if (/kubus|jaring|lipat|utara|selatan|ruang|rotasi/.test(lowerQ)) detectedCategory = 'Penalaran Spasial';
    else if (/semua|sebagian|jika|maka|premis|simpulan/.test(lowerQ)) detectedCategory = 'Penalaran Logis';
    else if (/tabel|grafik|data|persentase/.test(lowerQ)) detectedCategory = 'Kemampuan Analitis';

    parsed.push({
      tempId: 'EXT-' + Date.now() + '-' + idx,
      category: detectedCategory,
      subtopic: 'Hasil Ekstraksi Dokumen',
      difficulty: 'Sedang',
      question: questionText,
      options,
      correctIndex,
      explanation,
      tip: 'Periksa kembali hubungan antarinformasi pada soal.'
    });
  });

  return parsed;
}

// VIEW 2: PARTICIPANT DASHBOARD (EXAM MODES & PROGRESS OVERVIEW)
function renderParticipantDashboard() {
  const user = state.currentUser;
  const userHistory = state.history.filter(h => h.userId === user.id);
  const latestAttempt = userHistory[0];

  // Find weakest category from latest or average history
  let weakestCategory = null;
  let weakestModeId = 'numerik';
  if (latestAttempt && latestAttempt.categoryScores) {
    let minPct = 101;
    Object.entries(latestAttempt.categoryScores).forEach(([cat, st]) => {
      if (st.pct < minPct) {
        minPct = st.pct;
        weakestCategory = { name: cat, pct: st.pct };
      }
    });
    const catToMode = {
      'Kemampuan Verbal': 'verbal',
      'Kemampuan Numerik': 'numerik',
      'Kemampuan Figural': 'figural',
      'Penalaran Logis': 'logis',
      'Penalaran Spasial': 'spasial',
      'Kemampuan Analitis': 'analitis'
    };
    if (weakestCategory && catToMode[weakestCategory.name]) {
      weakestModeId = catToMode[weakestCategory.name];
    }
  }

  return `
    ${renderTopNavbar()}
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
      <!-- Participant Identity Banner -->
      <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div class="flex items-start sm:items-center gap-4">
          <div class="w-14 h-14 rounded-xl bg-navy-900 text-white font-display font-bold text-xl flex items-center justify-center shrink-0">
            ${user.name.charAt(0).toUpperCase()}
          </div>
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <h1 class="text-lg sm:text-xl font-bold text-navy-900">${user.name}</h1>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">Peserta Terdaftar</span>
            </div>
            <div class="text-xs sm:text-sm text-slate-600 mt-1 flex flex-wrap gap-x-4 gap-y-1">
              <span>Username: <strong class="text-navy-900">${user.username}</strong></span>
              <span>Asal Sekolah: <strong class="text-navy-900">${user.school || 'SMA Nusantara'}</strong></span>
              <span>Bank Soal Aktif: <strong class="text-navy-600">${state.questions.length} Butir</strong></span>
            </div>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2.5">
          <button onclick="navigateTo('history')" class="px-4 py-2.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-navy-900 text-xs sm:text-sm font-semibold flex items-center gap-2 transition">
            <i data-lucide="history" class="w-4 h-4 text-navy-600"></i>
            <span>Riwayat & Grafik Perkembangan (${userHistory.length})</span>
          </button>
          ${weakestCategory ? `
            <button onclick="prepareExamMode('${weakestModeId}')" class="px-4 py-2.5 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 text-xs sm:text-sm font-semibold flex items-center gap-2 transition">
              <i data-lucide="target" class="w-4 h-4 text-amber-600"></i>
              <span>Latih Kategori Lemah: ${weakestCategory.name} (${weakestCategory.pct}%)</span>
            </button>
          ` : ''}
        </div>
      </div>

      <!-- Section Heading -->
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2">
        <div>
          <h2 class="text-lg sm:text-xl font-bold text-navy-900">Pilih Mode Simulasi & Latihan ABM</h2>
          <p class="text-xs sm:text-sm text-slate-600">Pilih simulasi komprehensif atau latihan terfokus per kelompok kemampuan.</p>
        </div>
      </div>

      <!-- Exam Modes Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
        ${state.modes.map(mode => {
          const isPrimary = mode.id === 'simulasi_lengkap';
          return `
            <div class="bg-white rounded-xl border ${isPrimary ? 'border-navy-600 ring-2 ring-navy-600/15' : 'border-slate-200'} p-5 flex flex-col justify-between shadow-xs hover:shadow-md transition">
              <div>
                <div class="flex items-center justify-between gap-2 mb-3">
                  <span class="px-2.5 py-1 rounded-md text-[11px] font-bold ${isPrimary ? 'bg-navy-900 text-white' : 'bg-skysoft-100 text-navy-800'}">
                    ${mode.badge || 'Subtes ABM'}
                  </span>
                  <div class="flex items-center gap-3 text-xs text-slate-500 font-medium">
                    <span class="flex items-center gap-1"><i data-lucide="file-text" class="w-3.5 h-3.5"></i> ${mode.questionCount} Soal</span>
                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${mode.durationMinutes} Mnt</span>
                  </div>
                </div>
                <h3 class="text-base font-bold text-navy-900 mb-2">${mode.title}</h3>
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-5">${mode.description}</p>

              <button onclick="prepareExamMode('${mode.id}')" class="w-full py-2.5 px-4 rounded-lg ${isPrimary ? 'bg-navy-900 hover:bg-navy-800 text-white' : 'bg-skysoft-50 hover:bg-navy-900 text-navy-900 hover:text-white border border-skysoft-200 hover:border-navy-900'} text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2">

                <i data-lucide="chevron-right" class="w-4 h-4"></i>

          `;
        }).join('')}
      </div>
    </main>
    ${renderFooter()}
  `;
}

// VIEW 4: LIVE CBT EXAM INTERFACE
function renderExamView() {
  const exam = state.activeExam;
  if (!exam) return renderParticipantDashboard();

  const curIdx = exam.currentIndex;
  const q = exam.questions[curIdx];
  const totalQ = exam.questions.length;
  const answeredCount = Object.keys(exam.answers).length;
  const flaggedCount = Object.keys(exam.flagged).length;
  const unansweredCount = totalQ - answeredCount;
  const progressPct = Math.round((answeredCount / totalQ) * 100);

  const fontClasses = {
    sm: 'text-sm',
    base: 'text-base',
    lg: 'text-lg'
  }[state.fontSizeScale || 'base'];

  const isFlagged = Boolean(exam.flagged[curIdx]);
  const selectedOpt = exam.answers[curIdx];

  return `
    ${renderTopNavbar()}
    <!-- Exam Sub-bar: Mode Title & Progress Bar -->
    <div class="bg-white border-b border-slate-200 px-4 sm:px-6 py-2.5 no-print">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="text-xs sm:text-sm font-bold text-navy-900">${exam.modeTitle}</span>
          <span class="hidden sm:inline text-slate-300">|</span>
          <span class="hidden sm:inline text-xs text-slate-500">Peserta: <strong>${state.currentUser.name}</strong></span>
        </div>

        <div class="flex items-center gap-3 flex-1 sm:flex-initial max-w-xs w-full">
          <div class="flex-1 bg-slate-200 rounded-full h-2 overflow-hidden">
            <div class="bg-emerald-600 h-2 transition-all duration-300" style="width: ${progressPct}%"></div>
          </div>
          <span class="text-xs font-bold text-navy-900 whitespace-nowrap">${answeredCount}/${totalQ} Terjawab (${progressPct}%)</span>
          <!-- Mobile Drawer Trigger -->
          <button onclick="state.mobileDrawerOpen = !state.mobileDrawerOpen; render();" class="lg:hidden px-2.5 py-1 rounded bg-navy-900 text-white text-xs font-semibold flex items-center gap-1">
            <i data-lucide="grid" class="w-3.5 h-3.5"></i>
            <span>Nomor</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Main Split CBT Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- LEFT / MAIN QUESTION AREA (8 cols on desktop) -->
      <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col">
        <!-- Question Header Bar -->
        <div class="px-5 sm:px-6 py-3.5 bg-skysoft-50 border-b border-skysoft-200 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2.5">
            <span class="px-3 py-1 rounded-lg bg-navy-900 text-white font-display font-bold text-sm">
              SOAL NO. ${curIdx + 1}
            </span>
            <span class="px-2.5 py-1 rounded-md bg-white border border-skysoft-200 text-navy-800 text-xs font-semibold">
              ${q.category}
            </span>
          </div>
          <div class="flex items-center gap-2 text-xs">
            <span class="text-slate-500">${q.subtopic || ''}</span>
            <span class="px-2 py-0.5 rounded bg-slate-200/80 text-slate-700 font-medium">${q.difficulty}</span>
          </div>
        </div>

        <!-- Question Body & Stimulus -->
        <div class="p-5 sm:p-7 space-y-5 flex-1">
          ${q.svgAsset && SVG_ASSETS[q.svgAsset] ? `
            <div class="my-2">
              ${SVG_ASSETS[q.svgAsset]}
            </div>
          ` : ''}

          ${q.imageData ? `
            <div class="my-2 flex justify-center">
              <img src="${q.imageData}" alt="Gambar Soal" class="max-h-64 rounded-lg border border-slate-200 object-contain" />
            </div>
          ` : ''}

          <div class="${fontClasses} text-slate-800 leading-relaxed">
            ${q.question}
          </div>

          <!-- Options A - E -->
          <div class="space-y-2.5 pt-2">
            ${q.options.map((optText, oIdx) => {
              const letter = String.fromCharCode(65 + oIdx);
              const isSelected = selectedOpt === oIdx;
              return `
                <button
                  type="button"
                  onclick="selectExamAnswer(${curIdx}, ${oIdx})"
                  class="w-full text-left p-3.5 sm:p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${
                    isSelected
                      ? 'border-navy-600 bg-skysoft-100/80 shadow-xs'
                      : 'border-slate-200 bg-white hover:border-skysoft-200 hover:bg-slate-50'
                  }"
                >
                  <span class="w-8 h-8 rounded-lg font-display font-bold text-sm flex items-center justify-center shrink-0 transition ${
                    isSelected
                      ? 'bg-navy-900 text-white'
                      : 'bg-slate-100 text-navy-900 border border-slate-300'
                  }">
                    ${letter}
                  </span>
                  <span class="${fontClasses} pt-1 text-slate-800 font-medium leading-snug">${optText}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Bottom CBT Navigation Controls -->
        <div class="px-5 sm:px-6 py-4 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
          <button
            type="button"
            onclick="goToQuestion(${curIdx - 1})"
            ${curIdx === 0 ? 'disabled' : ''}
            class="px-4 py-2.5 rounded-lg border border-slate-300 bg-white text-navy-900 text-xs sm:text-sm font-semibold hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1.5 transition"
          >
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
            <span>Soal Sebelumnya</span>
          </button>

          <button
            type="button"
            onclick="toggleFlagQuestion(${curIdx})"
            class="px-4 py-2.5 rounded-lg border text-xs sm:text-sm font-semibold flex items-center gap-2 transition ${
              isFlagged
                ? 'bg-amber-400 border-amber-500 text-amber-950 shadow-xs'
                : 'bg-amber-50 border-amber-300 text-amber-900 hover:bg-amber-100'
            }"
          >
            <i data-lucide="flag" class="w-4 h-4"></i>
            <span>${isFlagged ? 'Ditandai Ragu-ragu' : 'Ragu-ragu'}</span>
          </button>

          ${curIdx < totalQ - 1 ? `
            <button
              type="button"
              onclick="goToQuestion(${curIdx + 1})"
              class="px-4 py-2.5 rounded-lg bg-navy-900 hover:bg-navy-800 text-white text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition"
            >
              <span>Soal Berikutnya</span>
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          ` : `
            <button
              type="button"
              onclick="confirmFinishExam()"
              class="px-5 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-sm transition"
            >
              <i data-lucide="check-circle" class="w-4 h-4"></i>
              <span>Selesai Ujian</span>
            </button>
          `}
        </div>
      </div>

      <!-- RIGHT SIDEBAR: QUESTION NUMBER GRID (4 cols on desktop, drawer on mobile) -->
      <aside class="${state.mobileDrawerOpen ? 'fixed inset-0 z-50 bg-slate-900/50 flex justify-end lg:static lg:bg-transparent lg:block' : 'hidden lg:block'} lg:col-span-4">
        <div class="bg-white w-80 max-w-full lg:w-full h-full lg:h-auto lg:rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between overflow-y-auto">
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
              <h3 class="text-sm font-bold text-navy-900 flex items-center gap-2">
                <i data-lucide="layout-grid" class="w-4 h-4 text-navy-600"></i>
                <span>Navigasi Nomor Soal</span>
              </h3>
              <button onclick="state.mobileDrawerOpen = false; render();" class="lg:hidden p-1 text-slate-500">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- Status Counters -->
            <div class="grid grid-cols-3 gap-2 mb-4 text-center text-xs">
              <div class="p-2 rounded-lg bg-emerald-50 border border-emerald-200">
                <div class="font-bold text-emerald-700 text-sm">${answeredCount}</div>
                <div class="text-[11px] text-emerald-800">Dijawab</div>
              </div>
              <div class="p-2 rounded-lg bg-amber-50 border border-amber-200">
                <div class="font-bold text-amber-700 text-sm">${flaggedCount}</div>
                <div class="text-[11px] text-amber-800">Ragu-ragu</div>
              </div>
              <div class="p-2 rounded-lg bg-slate-50 border border-slate-200">
                <div class="font-bold text-slate-700 text-sm">${unansweredCount}</div>
                <div class="text-[11px] text-slate-600">Kosong</div>
              </div>
            </div>

            <!-- Number Buttons Grid -->
            <div class="grid grid-cols-5 gap-2 mb-5">
              ${exam.questions.map((_, idx) => {
                const isCurrent = idx === curIdx;
                const hasAns = exam.answers[idx] !== undefined;
                const isFlg = Boolean(exam.flagged[idx]);
                const chosenLetter = hasAns ? String.fromCharCode(65 + exam.answers[idx]) : '';

                let btnStyle = 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50';
                if (isFlg) {
                  btnStyle = 'bg-amber-400 border-amber-500 text-amber-950 font-bold';
                } else if (hasAns) {
                  btnStyle = 'bg-emerald-600 border-emerald-700 text-white font-bold';
                }

                return `
                  <button
                    type="button"
                    onclick="goToQuestion(${idx})"
                    class="relative h-10 rounded-lg border text-xs flex items-center justify-center transition ${btnStyle} ${isCurrent ? 'ring-2 ring-offset-1 ring-navy-900 scale-105' : ''}"
                  >
                    <span>${idx + 1}</span>
                    ${hasAns ? `<span class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-navy-900 text-white text-[9px] font-bold flex items-center justify-center shadow-xs">${chosenLetter}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Legend -->
            <div class="space-y-1.5 text-[11px] text-slate-600 border-t border-slate-100 pt-3 mb-5">
              <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded bg-emerald-600 inline-block"></span> Sudah dijawab</div>
              <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded bg-amber-400 inline-block"></span> Ditandai ragu-ragu</div>
              <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded bg-white border border-slate-300 inline-block"></span> Belum dijawab</div>
              <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded border-2 border-navy-900 inline-block"></span> Posisi soal aktif</div>
            </div>
          </div>

          <button
            type="button"
            onclick="confirmFinishExam()"
            class="w-full py-3 px-4 rounded-xl bg-navy-900 hover:bg-navy-800 text-white font-bold text-sm shadow-sm transition flex items-center justify-center gap-2"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
            <span>Kumpulkan Ujian</span>
          </button>
        </div>
      </aside>
    </main>
  `;
}

// VIEW 5: POST-EXAM RESULTS, ANALYTICS & PEMBAHASAN
function renderResultView() {
  const att = state.selectedAttempt;
  if (!att) return renderParticipantDashboard();

  const catEntries = Object.entries(att.categoryScores || {});
  let strongestCat = null;
  let weakestCat = null;
  catEntries.forEach(([name, st]) => {
    if (!strongestCat || st.pct > strongestCat.pct) strongestCat = { name, ...st };
    if (!weakestCat || st.pct < weakestCat.pct) weakestCat = { name, ...st };
  });

  const catToMode = {
    'Kemampuan Verbal': 'verbal',
    'Kemampuan Numerik': 'numerik',
    'Kemampuan Figural': 'figural',
    'Penalaran Logis': 'logis',
    'Penalaran Spasial': 'spasial',
    'Kemampuan Analitis': 'analitis'
  };

  // Filter items for Pembahasan tab
  const filteredItems = (att.items || []).filter(item => {
    if (state.pembahasanFilter === 'ALL') return true;
    if (state.pembahasanFilter === 'WRONG') return item.isCorrect === false;
    if (state.pembahasanFilter === 'FLAGGED') return item.isFlagged === true;
    return item.category === state.pembahasanFilter;
  });

  return `
    ${renderTopNavbar()}
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
      <!-- Top Action Bar -->
      <div class="flex flex-wrap items-center justify-between gap-3 no-print">
        <button onclick="navigateTo('dashboard')" class="inline-flex items-center gap-1.5 text-sm font-semibold text-navy-700 hover:text-navy-900">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Kembali ke Beranda Ujian</span>
        </button>

        <div class="flex flex-wrap items-center gap-2.5">
          <button onclick="window.print()" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-navy-900 text-xs sm:text-sm font-semibold flex items-center gap-2 shadow-2xs">
            <i data-lucide="printer" class="w-4 h-4 text-navy-600"></i>
            <span>Cetak / Simpan Laporan PDF</span>
          </button>
          <button onclick="prepareExamMode('${att.modeId}')" class="px-4 py-2 rounded-lg bg-navy-900 hover:bg-navy-800 text-white text-xs sm:text-sm font-semibold flex items-center gap-2 shadow-2xs">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            <span>Ulangi Simulasi (Soal Acak)</span>
          </button>
        </div>
      </div>

      <!-- Official Report Header Card -->
      <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-xs print-shadow-none">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-200">
          <div>
            <div class="text-xs font-bold uppercase tracking-wider text-navy-600 mb-1">Laporan Hasil Evaluasi CBT • ABM SMART TEST</div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-navy-900">${att.modeTitle}</h1>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">
              Peserta: <strong>${att.userName}</strong> (${att.username}) • Tanggal: ${new Date(att.date).toLocaleString('id-ID')}
            </p>
          </div>
          <div class="flex items-center gap-4 bg-skysoft-50 border border-skysoft-200 px-5 py-3 rounded-xl">
            <div>
              <div class="text-[11px] font-bold uppercase text-navy-700">Skor Skala CBT</div>
              <div class="text-3xl font-display font-extrabold text-navy-900">${att.cognitiveTotal > 0 ? att.cbtScore : 'Profil'}</div>
            </div>
            <div class="h-10 w-px bg-skysoft-200"></div>
            <div>
              <div class="text-[11px] font-bold uppercase text-navy-700">Ketepatan</div>
              <div class="text-2xl font-display font-bold text-emerald-700">${att.cognitiveTotal > 0 ? att.accuracy + '%' : 'Lengkap'}</div>
            </div>
          </div>
        </div>

        <!-- KPI Summary Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 pt-6">
          <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
            <div class="text-xs text-slate-500">Total Soal Kognitif</div>
            <div class="text-xl font-bold text-navy-900 mt-0.5">${att.cognitiveTotal} Butir</div>
          </div>
          <div class="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200">
            <div class="text-xs text-emerald-700">Jawaban Benar</div>
            <div class="text-xl font-bold text-emerald-700 mt-0.5">${att.correctCount}</div>
          </div>
          <div class="p-3.5 rounded-xl bg-red-50 border border-red-200">
            <div class="text-xs text-red-700">Jawaban Salah</div>
            <div class="text-xl font-bold text-red-700 mt-0.5">${att.incorrectCount}</div>
          </div>
          <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200">
            <div class="text-xs text-amber-800">Tidak Dijawab</div>
            <div class="text-xl font-bold text-amber-800 mt-0.5">${att.unansweredCount}</div>
          </div>
          <div class="p-3.5 rounded-xl bg-skysoft-50 border border-skysoft-200 col-span-2 sm:col-span-1">
            <div class="text-xs text-navy-700">Waktu Pengerjaan</div>
            <div class="text-xl font-bold text-navy-900 mt-0.5">${formatTime(att.durationSecondsUsed)}</div>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs: Analisis & Grafik vs Pembahasan Lengkap -->
      <div class="flex border-b border-slate-200 gap-2 no-print">
        <button onclick="state.resultTab='summary'; render();" class="px-5 py-3 text-sm font-bold border-b-2 transition ${state.resultTab === 'summary' ? 'border-navy-900 text-navy-900' : 'border-transparent text-slate-500 hover:text-navy-800'}">
          Analisis Kemampuan & Profil Minat
        </button>
        <button onclick="state.resultTab='pembahasan'; render();" class="px-5 py-3 text-sm font-bold border-b-2 transition flex items-center gap-2 ${state.resultTab === 'pembahasan' ? 'border-navy-900 text-navy-900' : 'border-transparent text-slate-500 hover:text-navy-800'}">
          <span>Pembahasan Soal Lengkap</span>
          <span class="px-2 py-0.5 rounded-full text-xs bg-navy-100 text-navy-900">${(att.items || []).length}</span>
        </button>
      </div>

      ${state.resultTab === 'summary' ? `
        <!-- TAB 1: ANALYTICS & INTEREST PROFILE -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Category Breakdown Chart -->
          ${catEntries.length > 0 ? `
            <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs print-shadow-none">
              <h3 class="text-base font-bold text-navy-900 mb-1">Grafik Capaian per Kelompok Kemampuan</h3>
              <p class="text-xs text-slate-500 mb-5">Persentase ketepatan jawaban pada setiap domain penalaran yang diujikan.</p>

              <div class="space-y-4">
                ${catEntries.map(([catName, st]) => {
                  const barColor = st.pct >= 75 ? 'bg-emerald-600' : st.pct >= 50 ? 'bg-navy-600' : 'bg-amber-500';
                  return `
                    <div>
                      <div class="flex justify-between text-xs sm:text-sm font-semibold mb-1.5">
                        <span class="text-navy-900">${catName}</span>
                        <span class="text-slate-700">${st.correct}/${st.total} Benar (${st.pct}%)</span>
                      </div>
                      <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
                        <div class="${barColor} h-full rounded-full transition-all duration-500" style="width: ${st.pct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Strengths & Weaknesses Recommendations -->
            <div class="lg:col-span-5 space-y-4">
              ${strongestCat ? `
                <div class="bg-white rounded-2xl border border-emerald-200 p-5 shadow-xs print-shadow-none">
                  <div class="flex items-center gap-2 text-emerald-700 text-xs font-bold uppercase mb-2">
                    <i data-lucide="award" class="w-4 h-4"></i>
                    <span>Kategori Paling Dikuasai</span>
                  </div>
                  <div class="text-lg font-bold text-navy-900">${strongestCat.name}</div>
                  <p class="text-xs sm:text-sm text-slate-600 mt-1">
                    Anda meraih ketepatan <strong>${strongestCat.pct}%</strong> (${strongestCat.correct} dari ${strongestCat.total} soal). Pertahankan konsistensi ketelitian Anda pada subtes ini.
                  </p>
                </div>
              ` : ''}

              ${weakestCat ? `
                <div class="bg-white rounded-2xl border border-amber-200 p-5 shadow-xs print-shadow-none">
                  <div class="flex items-center gap-2 text-amber-700 text-xs font-bold uppercase mb-2">
                    <i data-lucide="trending-up" class="w-4 h-4"></i>
                    <span>Kategori Perlu Ditingkatkan</span>
                  </div>
                  <div class="text-lg font-bold text-navy-900">${weakestCat.name}</div>
                  <p class="text-xs sm:text-sm text-slate-600 mt-1 mb-4">
                    Ketepatan Anda pada bagian ini sebesar <strong>${weakestCat.pct}%</strong>. Disarankan mempelajari pembahasan soal dan berlatih kembali pada subtes ini.
                  </p>
                  ${catToMode[weakestCat.name] ? `
                    <button onclick="prepareExamMode('${catToMode[weakestCat.name]}')" class="w-full py-2 px-3 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition no-print">
                      Latih Ulang ${weakestCat.name} Sekarang
                    </button>
                  ` : ''}
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- Interest & Preference Profile (RIASEC) -->
          ${att.riasecScores ? `
            <div class="lg:col-span-12 bg-white rounded-2xl border border-slate-200 p-6 sm:p-7 shadow-xs print-shadow-none print-break-inside">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-slate-200 mb-5">
                <div>
                  <h3 class="text-base sm:text-lg font-bold text-navy-900">Profil Preferensi Minat Akademik & Bidang Studi (RIASEC)</h3>
                  <p class="text-xs text-slate-500">Pemetaan kecenderungan ketertarikan aktivitas dan lingkungan kerja berdasarkan respons Anda.</p>
                </div>
                <span class="px-3 py-1 rounded-full bg-skysoft-100 text-navy-800 text-xs font-semibold">Indikator Preferensi</span>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-5">
                ${Object.entries(att.riasecScores)
                  .sort((a, b) => b[1] - a[1])
                  .map(([dim, score], rankIdx) => {
                    const info = RIASEC_INFO[dim] || { label: dim, desc: '', majors: '' };
                    const isTop = rankIdx < 2;
                    return `
                      <div class="p-4 rounded-xl border ${isTop ? 'border-navy-600 bg-skysoft-50/70' : 'border-slate-200 bg-white'}">
                        <div class="flex items-center justify-between mb-2">
                          <span class="text-xs font-bold ${isTop ? 'text-navy-900' : 'text-slate-700'}">${info.label}</span>
                          <span class="px-2 py-0.5 rounded text-xs font-extrabold ${isTop ? 'bg-navy-900 text-white' : 'bg-slate-100 text-slate-700'}">${score}%</span>
                        </div>
                        <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden mb-2.5">
                          <div class="${isTop ? 'bg-navy-600' : 'bg-slate-400'} h-full rounded-full" style="width: ${score}%"></div>
                        </div>
                        <p class="text-xs text-slate-600 mb-2">${info.desc}</p>
                        <div class="text-[11px] text-navy-800 bg-white p-2 rounded border border-slate-200/80">
                          <strong>Rekomendasi Eksplorasi Studi:</strong> ${info.majors}
                        </div>
                      </div>
                    `;
                  }).join('')}
              </div>

              <div class="p-3.5 rounded-xl bg-skysoft-50 border border-skysoft-200 text-xs text-navy-900 flex items-start gap-2.5">
                <i data-lucide="info" class="w-4 h-4 text-navy-600 shrink-0 mt-0.5"></i>
                <span><strong>Catatan Interpretasi:</strong> Profil di atas menggambarkan kecenderungan minat dan preferensi cara bekerja Anda saat ini sebagai bahan refleksi pemilihan jurusan/karier, dan <strong>bukan merupakan diagnosis psikologis maupun penentuan bakat mutlak</strong>.</span>
              </div>
            </div>
          ` : ''}
        </div>
      ` : `
        <!-- TAB 2: PEMBAHASAN SOAL LENGKAP -->
        <div class="space-y-4">
          <!-- Filter Pills -->
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex flex-wrap items-center gap-2 no-print">
            <span class="text-xs font-bold text-slate-600 mr-1">Filter Pembahasan:</span>
            ${[
              { id: 'ALL', label: 'Semua Soal' },
              { id: 'WRONG', label: 'Jawaban Salah' },
              { id: 'FLAGGED', label: 'Ditandai Ragu-ragu' },
              ...Object.keys(att.categoryScores || {}).map(c => ({ id: c, label: c }))
            ].map(f => `
              <button onclick="state.pembahasanFilter='${f.id}'; render();" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${state.pembahasanFilter === f.id ? 'bg-navy-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                ${f.label}
              </button>
            `).join('')}
          </div>

          ${filteredItems.length === 0 ? `
            <div class="bg-white rounded-xl border border-slate-200 p-8 text-center text-sm text-slate-500">
              Tidak ada soal yang sesuai dengan filter pilihan Anda.
            </div>
          ` : filteredItems.map((item, idx) => {
            const isPref = item.category === 'Minat dan Preferensi';
            const statusBadge = isPref
              ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-skysoft-100 text-navy-800">Inventori Preferensi</span>`
              : item.isCorrect
                ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">Benar</span>`
                : item.userAnswer === null
                  ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">Tidak Dijawab</span>`
                  : `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-800">Salah</span>`;

            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs print-break-inside">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100 mb-4">
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-1 rounded bg-navy-900 text-white text-xs font-bold">Butir #${idx + 1}</span>
                    <span class="text-xs font-semibold text-navy-700">${item.category} • ${item.subtopic || ''}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    ${item.isFlagged ? `<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 text-[11px] font-semibold">Ditandai Ragu</span>` : ''}
                    ${statusBadge}
                  </div>
                </div>

                ${item.svgAsset && SVG_ASSETS[item.svgAsset] ? `<div class="mb-3">${SVG_ASSETS[item.svgAsset]}</div>` : ''}
                ${item.imageData ? `<img src="${item.imageData}" class="max-h-52 rounded border mb-3" />` : ''}

                <div class="text-sm sm:text-base text-slate-800 mb-4 leading-relaxed">${item.question}</div>

                <!-- Options Review -->
                <div class="space-y-2 mb-4">
                  ${item.options.map((opt, oIdx) => {
                    const letter = String.fromCharCode(65 + oIdx);
                    const isUserChoice = item.userAnswer === oIdx;
                    const isKey = !isPref && item.correctIndex === oIdx;

                    let boxClass = 'border-slate-200 bg-slate-50/50 text-slate-700';
                    let tag = '';
                    if (isKey) {
                      boxClass = 'border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold';
                      tag = `<span class="ml-auto text-[11px] font-bold px-2 py-0.5 rounded bg-emerald-600 text-white">Kunci Jawaban</span>`;
                    } else if (isUserChoice && !isPref) {
                      boxClass = 'border-red-400 bg-red-50 text-red-950 font-medium';
                      tag = `<span class="ml-auto text-[11px] font-bold px-2 py-0.5 rounded bg-red-600 text-white">Jawaban Anda</span>`;
                    } else if (isUserChoice && isPref) {
                      boxClass = 'border-navy-500 bg-skysoft-100 text-navy-950 font-semibold';
                      tag = `<span class="ml-auto text-[11px] font-bold px-2 py-0.5 rounded bg-navy-900 text-white">Pilihan Anda</span>`;
                    }

                    return `
                      <div class="p-2.5 sm:p-3 rounded-lg border text-xs sm:text-sm flex items-center gap-2.5 ${boxClass}">
                        <span class="w-6 h-6 rounded bg-white border border-slate-300 flex items-center justify-center font-bold text-xs shrink-0">${letter}</span>
                        <span>${opt}</span>
                        ${tag}
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- Explanation & Tip Box -->
                <div class="bg-skysoft-50 border border-skysoft-200 rounded-xl p-4 space-y-2">
                  <div class="text-xs font-bold uppercase tracking-wider text-navy-800 flex items-center gap-1.5">
                    <i data-lucide="lightbulb" class="w-4 h-4 text-navy-600"></i>
                    <span>Pembahasan & Pola Penalaran</span>
                  </div>
                  <div class="text-xs sm:text-sm text-slate-700 leading-relaxed">${item.explanation}</div>
                  ${item.tip ? `
                    <div class="pt-2 border-t border-skysoft-200 text-xs text-navy-900">
                      <strong>Tips Mengerjakan Soal Sejenis:</strong> ${item.tip}
                    </div>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </main>
    ${renderFooter()}
  `;
}

// VIEW 6: PARTICIPANT HISTORY & PROGRESS CHART
function renderHistoryView() {
  const user = state.currentUser;
  const userAttempts = state.history.filter(h => h.userId === user.id);
  const chronological = [...userAttempts].reverse();

  return `
    ${renderTopNavbar()}
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <button onclick="navigateTo('dashboard')" class="inline-flex items-center gap-1.5 text-sm font-semibold text-navy-700 hover:text-navy-900">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Kembali ke Beranda Ujian</span>
        </button>
        <h1 class="text-lg sm:text-xl font-bold text-navy-900">Riwayat Latihan & Grafik Perkembangan Nilai</h1>
      </div>

      <!-- Progress Trend Chart -->
      <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
        <h2 class="text-base font-bold text-navy-900 mb-1">Tren Perkembangan Skor CBT</h2>
        <p class="text-xs text-slate-500 mb-5">Perbandingan skor skala CBT (200–1000) dari percobaan pertama hingga terbaru.</p>

        ${chronological.length === 0 ? `
          <div class="py-10 text-center text-sm text-slate-500">Belum ada riwayat simulasi. Silakan mulai simulasi pertama Anda!</div>
        ` : `
          <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4 items-end h-52 pt-6 px-2 border-b border-slate-200">
            ${chronological.map((att, idx) => {
              const heightPct = Math.max(15, Math.min(100, Math.round((att.cbtScore / 1000) * 100)));
              return `
                <div class="flex flex-col items-center h-full justify-end group">
                  <span class="text-xs font-extrabold text-navy-900 mb-1">${att.cbtScore}</span>
                  <div class="w-full max-w-[48px] bg-navy-600 group-hover:bg-navy-900 rounded-t-lg transition-all" style="height: ${heightPct}%"></div>
                  <span class="text-[11px] font-semibold text-slate-600 mt-2">Tes #${idx + 1}</span>
                  <span class="text-[10px] text-slate-400">${new Date(att.date).toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })}</span>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>

      <!-- Attempts Table -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 font-bold text-sm text-navy-900">
          Daftar Riwayat Simulasi (${userAttempts.length} Percobaan)
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm">
            <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
              <tr>
                <th class="px-5 py-3">Tanggal & Waktu</th>
                <th class="px-5 py-3">Mode Simulasi</th>
                <th class="px-5 py-3 text-center">Skor CBT</th>
                <th class="px-5 py-3 text-center">Akurasi</th>
                <th class="px-5 py-3 text-center">Durasi</th>
                <th class="px-5 py-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${userAttempts.map(att => `
                <tr class="hover:bg-skysoft-50/50">
                  <td class="px-5 py-3.5 text-slate-600">${new Date(att.date).toLocaleString('id-ID')}</td>
                  <td class="px-5 py-3.5 font-semibold text-navy-900">${att.modeTitle}</td>
                  <td class="px-5 py-3.5 text-center font-bold text-navy-700">${att.cbtScore}</td>
                  <td class="px-5 py-3.5 text-center">
                    <span class="px-2 py-0.5 rounded-full text-xs font-bold ${att.accuracy >= 70 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${att.accuracy}%</span>
                  </td>
                  <td class="px-5 py-3.5 text-center text-slate-600">${formatTime(att.durationSecondsUsed)}</td>
                  <td class="px-5 py-3.5 text-right">
                    <button onclick="viewAttemptResult('${att.id}')" class="px-3 py-1.5 rounded-lg bg-navy-900 hover:bg-navy-800 text-white text-xs font-semibold">
                      Detail & Pembahasan
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </main>
    ${renderFooter()}
  `;
}

// VIEW 7: ADMIN DASHBOARD (BANK SOAL, REAL UPLOAD PDF/DOCX, MODES, USERS, REPORTS)

    const searchOk = !state.adminSearchQuery || q.question.toLowerCase().includes(state.adminSearchQuery.toLowerCase()) || q.subtopic.toLowerCase().includes(state.adminSearchQuery.toLowerCase());
    return catOk && diffOk && searchOk;

                      <td class="px-4 py-3 text-slate-600">${u.school || '-'}</td>
                      <td class="px-4 py-3 text-center">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${u.role === 'admin' ? 'bg-navy-900 text-white' : 'bg-skysoft-100 text-navy-800'}">${u.role}</span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      ` : `
        <!-- TAB: ALL PARTICIPANTS EXAM RESULTS -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="font-bold text-sm sm:text-base text-navy-900">Rekapitulasi Hasil Ujian Seluruh Peserta (${state.history.length})</div>
            <button onclick="exportResultsCSV()" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-2">
              <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
              <span>Unduh Laporan (CSV / Excel)</span>
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs sm:text-sm">
              <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                <tr>
                  <th class="px-4 py-3">Peserta</th>
                  <th class="px-4 py-3">Mode Ujian</th>
                  <th class="px-4 py-3">Waktu Selesai</th>
                  <th class="px-4 py-3 text-center">Skor CBT</th>
                  <th class="px-4 py-3 text-center">Benar/Total</th>
                  <th class="px-4 py-3 text-right">Laporan</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.history.map(h => `
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-3">
                      <div class="font-bold text-navy-900">${h.userName}</div>
                      <div class="text-xs text-slate-500">@${h.username}</div>
                    </td>
                    <td class="px-4 py-3 text-slate-700">${h.modeTitle}</td>
                    <td class="px-4 py-3 text-slate-500 text-xs">${new Date(h.date).toLocaleString('id-ID')}</td>
                    <td class="px-4 py-3 text-center font-extrabold text-navy-900">${h.cbtScore}</td>
                    <td class="px-4 py-3 text-center">${h.correctCount}/${h.cognitiveTotal} (${h.accuracy}%)</td>
                    <td class="px-4 py-3 text-right">
                      <button onclick="viewAttemptResult('${h.id}')" class="px-3 py-1 rounded bg-skysoft-100 text-navy-900 text-xs font-semibold hover:bg-skysoft-200">Lihat Detail</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `}
    </main>
    ${renderFooter()}
  `;
}

// ----------------------------------------------------------------------------
// 11. MASTER RENDER CONTROLLER
// ----------------------------------------------------------------------------
function render() {
  const appEl = document.getElementById('app');
  if (!appEl) return;

  let html = '';
  switch (state.view) {
    case 'login':
      html = renderLoginView();
      break;
    case 'dashboard':
      html = renderParticipantDashboard();
      break;
    case 'confirm_exam':
      html = renderConfirmExamView();
      break;
    case 'exam':
      html = renderExamView();
      break;
    case 'result':
      html = renderResultView();
      break;
    case 'history':
      html = renderHistoryView();
      break;
    case 'admin':
      html = renderAdminView();
      break;
    default:
      html = renderLoginView();
  }

  appEl.innerHTML = html;
  if (window.lucide) {
    lucide.createIcons();
  }
}

// Boot Application
window.onload = function() {
  render();
  if (state.view === 'exam' && state.activeExam) {
    startExamTimer();
  }
};
</script>
</body>
</html>
